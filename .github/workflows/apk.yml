name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'icon-*.png', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor Android projesi olustur
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Parsel Haritası" com.enginbaysal.parselharita --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/$f.png; done
          cat > android/app/src/main/java/com/enginbaysal/parselharita/FileSaverPlugin.java <<'JAVAEOF'
          package com.enginbaysal.parselharita;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "FileSaver")
          public class FileSaverPlugin extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String name = call.getString("name");
                  String data = call.getString("data");
                  String mime = call.getString("mime", "application/octet-stream");
                  String b64 = call.getString("base64");
                  if (name == null || (data == null && b64 == null)) { call.reject("name ve data gerekli"); return; }
                  try {
                      byte[] bytes = b64 != null ? android.util.Base64.decode(b64, android.util.Base64.DEFAULT) : data.getBytes("UTF-8");
                      JSObject ret = new JSObject();
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentResolver r = getContext().getContentResolver();
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) throw new IOException("Kayit olusturulamadi");
                          OutputStream os = r.openOutputStream(uri);
                          try { os.write(bytes); } finally { os.close(); }
                          ret.put("uri", uri.toString());
                      } else {
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          dir.mkdirs();
                          File f = new File(dir, name);
                          FileOutputStream os = new FileOutputStream(f);
                          try { os.write(bytes); } finally { os.close(); }
                          ret.put("uri", f.getAbsolutePath());
                      }
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVAEOF
          cat > android/app/src/main/java/com/enginbaysal/parselharita/MainActivity.java <<'JAVAEOF'
          package com.enginbaysal.parselharita;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FileSaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: parsel-haritasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yi Release olarak yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk parsel-haritasi.apk
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son parsel-haritasi.apk --target main --title "Parsel Haritası APK" --notes "Android için son sürüm. İndirip kurun."
